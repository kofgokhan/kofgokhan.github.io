<!DOCTYPE html>
<html data-bs-theme="dark">

<head>
    <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'dark');</script>
    {{ partial "head.html" . }}
    <title>{{ .Site.Title }}</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=invert_colors,mail" />
</head>

<body>
    {{ partial "navbar.html" . }}

    <div class="d-flex">
        {{ partial "nav.html" . }}

        <main class="col-md-6 flex-grow-1 p-4 libertinus-math-regular">
            <div id="content" style="text-align: justify;">
                {{ block "main" . }}{{ end }}
            </div>
        </main>

        {{ partial "sidebar.html" . }}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
