{{ define "main" }}
<article class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-12">
      <header class="mb-4 border-bottom">
        <h1 class="fw-bold">{{ .Title }}</h1>
        <p class="text-muted">{{ .Date.Format "January 2, 2006" }}</p>
      </header>
      <section class="content">
        {{ .Content }}
      </section>
    </div>
  </div>
</article>
{{ end }}
